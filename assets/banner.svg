<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Primary Violet-Indigo Brand Gradient -->
    <linearGradient id="brandV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Soft Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Banner Container -->
  <rect width="600" height="160" rx="28" fill="#090D16" />
  <rect x="4" y="4" width="592" height="152" rx="24" fill="none" stroke="#334155" stroke-width="3" opacity="0.5" />

  <!-- Original AA Emblem Icon (Unchanged) -->
  <g transform="translate(24, 16) scale(0.25)">
    <rect width="512" height="512" rx="115" fill="#1E1B4B" stroke="#6366F1" stroke-width="12" />
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#brandV)" stroke-width="20" stroke-dasharray="840 1200" stroke-linecap="round" transform="rotate(-135 256 256)" />
    <path d="M256 108 L138 372 L192 372 L256 224 L320 372 L374 372 Z" fill="url(#brandV)" />
    <path d="M256 108 L320 372 L374 372 Z" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- Vertically Centered "AlNime" Typography (No Bottom Green Text) -->
  <text x="176" y="104" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="72" font-weight="900" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Al</tspan><tspan fill="url(#brandV)" filter="url(#glow)">Nime</tspan>
  </text>
</svg>