<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Slate App Icon Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Primary Violet-Indigo Brand Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Soft Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#334155" stroke-width="3" opacity="0.4" />

  <!-- Outer Chrono Track Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="14" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-dasharray="840 1200" stroke-linecap="round" transform="rotate(-135 256 256)" filter="url(#glow)" />

  <!-- Clock Tick Marks -->
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="42" x2="256" y2="54" />
    <line x1="256" y1="458" x2="256" y2="470" />
    <line x1="42" y1="256" x2="54" y2="256" />
    <line x1="458" y1="256" x2="470" y2="256" />
  </g>

  <!-- Stylized "AA" (AniAlker) Monogram Peak -->
  <path d="M256 108 L138 372 L192 372 L256 224 L320 372 L374 372 Z" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Inner Shadow Accent for Depth -->
  <path d="M256 108 L320 372 L374 372 Z" fill="#ffffff" opacity="0.12" />
</svg>