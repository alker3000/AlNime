name: ani_alker
description: "AniAlker — Native Personal Anime Wishlist, Checklist, Timestamp Tracker, and In-App Streaming Bridge."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Persistence
  shared_preferences: ^2.3.2

  # Networking
  http: ^1.2.2

  # Native Embedded WebView & External URL Fallback
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1

  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

  # Local File Export / Import
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.2

  # Image Caching & Vector Rendering
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/banner.svg
    - assets/icon.svg
