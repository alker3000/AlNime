name: Build AniAlker Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Generate Native Platform Scaffolding & Preserve Custom Manifest
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          flutter create . --project-name ani_alker --org com.alker
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          rm -rf test

      - name: Install Dependencies & Patch Plugin Gradle ProGuard Rules
        run: |
          flutter pub get
          find "$HOME/.pub-cache" -name "build.gradle*" -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} +

      - name: Verify Dart Compilation
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload AniAlker APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniAlker-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
